    /* ===== woff ===== */
    @font-face {
      font-family: 'IRANYekanXFaNum';
      src: url('/fonts/IRANYekanXFaNum/woff/IRANYekanXFaNum-Regular.woff') format('woff');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'IRANYekanXFaNum';
      src: url('/fonts/IRANYekanXFaNum/woff/IRANYekanXFaNum-Bold.woff') format('woff');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'IRANYekanXFaNum';
      src: url('/fonts/IRANYekanXFaNum/woff/IRANYekanXFaNum-Light.woff') format('woff');
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'IRANYekanXFaNum';
      src: url('/fonts/IRANYekanXFaNum/woff/IRANYekanXFaNum-Black.woff') format('woff');
      font-weight: 900;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'IRANYekanXFaNum';
      src: url('/fonts/IRANYekanXFaNum/woff/IRANYekanXFaNum-ExtraBlack.woff') format('woff');
      font-weight: 950;
      font-style: normal;
      font-display: swap;
    }

    /* ===== ttf (فایرفاکس اندروید) ===== */
    @font-face {
      font-family: 'IRANYekanXFaNum';
      src: url('/fonts/IRANYekanXFaNum/ttf/IRANYekanXFaNum-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'IRANYekanXFaNum';
      src: url('/fonts/IRANYekanXFaNum/ttf/IRANYekanXFaNum-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'IRANYekanXFaNum';
      src: url('/fonts/IRANYekanXFaNum/ttf/IRANYekanXFaNum-Light.ttf') format('truetype');
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'IRANYekanXFaNum';
      src: url('/fonts/IRANYekanXFaNum/ttf/IRANYekanXFaNum-Black.ttf') format('truetype');
      font-weight: 900;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'IRANYekanXFaNum';
      src: url('/fonts/IRANYekanXFaNum/ttf/IRANYekanXFaNum-ExtraBlack.ttf') format('truetype');
      font-weight: 950;
      font-style: normal;
      font-display: swap;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'IRANYekanXFaNum', 'Segoe UI', Tahoma, sans-serif !important;
    }

    body {
      font-family: 'IRANYekanXFaNum', 'Segoe UI', Tahoma, sans-serif !important;
      background: #f5f7fa;
      color: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      direction: rtl;
      padding: 20px;
    }

    .offline-container {
      max-width: 420px;
      width: 100%;
      text-align: center;
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .offline-icon {
      font-size: 72px;
      margin-bottom: 16px;
      display: block;
    }

    .offline-title {
      font-size: 24px;
      font-weight: 700;
      color: #1a237e;
      margin-bottom: 8px;
      font-family: 'IRANYekanXFaNum', 'Segoe UI', Tahoma, sans-serif !important;
    }

    .offline-subtitle {
      font-size: 16px;
      color: #666;
      margin-bottom: 20px;
      line-height: 1.7;
      font-family: 'IRANYekanXFaNum', 'Segoe UI', Tahoma, sans-serif !important;
    }

    .offline-message {
      background: #fff8e1;
      padding: 14px 18px;
      border-radius: 10px;
      border-right: 4px solid #f57c00;
      font-size: 14px;
      color: #555;
      margin-bottom: 24px;
      text-align: right;
      line-height: 1.6;
      font-family: 'IRANYekanXFaNum', 'Segoe UI', Tahoma, sans-serif !important;
    }

    .offline-message .emoji {
      font-size: 18px;
    }

    .btn-retry {
      padding: 14px 32px;
      background: linear-gradient(135deg, #1a237e, #0d47a1);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'IRANYekanXFaNum', 'Segoe UI', Tahoma, sans-serif !important;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-retry:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(26, 35, 126, 0.4);
    }

    .btn-retry:active {
      transform: translateY(0);
    }

    .offline-footer {
      margin-top: 20px;
      font-size: 13px;
      color: #999;
      font-family: 'IRANYekanXFaNum', 'Segoe UI', Tahoma, sans-serif !important;
    }

    .offline-footer a {
      color: #1a237e;
      text-decoration: none;
      font-weight: 500;
      font-family: 'IRANYekanXFaNum', 'Segoe UI', Tahoma, sans-serif !important;
    }

    .offline-footer a:hover {
      text-decoration: underline;
    }

    .offline-status {
      margin-top: 12px;
      font-size: 13px;
      color: #888;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: 'IRANYekanXFaNum', 'Segoe UI', Tahoma, sans-serif !important;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .status-dot.offline {
      background: #c62828;
    }

    .status-dot.checking {
      background: #f57c00;
      animation: pulse 1s infinite;
    }

    .status-dot.online {
      background: #2e7d32;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @media (max-width: 480px) {
      .offline-container {
        padding: 28px 20px;
      }

      .offline-title {
        font-size: 20px;
      }

      .offline-icon {
        font-size: 56px;
      }
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <span class="offline-icon">📡</span>
    <h1 class="offline-title">اتصال اینترنت برقرار نیست</h1>
    <p class="offline-subtitle">
      برای استفاده از ژورنال حرفه‌ای ترید، به اتصال اینترنت نیاز دارید.
    </p>
    <div class="offline-message">
      <span class="emoji">🔄</span> لطفاً اتصال اینترنت خود را بررسی کنید و دوباره تلاش کنید.
      <br>
      <span style="font-size:13px;color:#888;display:block;margin-top:4px;font-family:'IRANYekanXFaNum','Segoe UI',Tahoma,sans-serif !important;">
        پس از برقراری اتصال، صفحه به‌طور خودکار بارگذاری می‌شود.
      </span>
    </div>
    <button class="btn-retry" onclick="window.location.reload()">
      🔄 تلاش مجدد
    </button>
    <div class="offline-footer">
      <a href="/dashboard">↩️ بازگشت به داشبورد</a>
    </div>
    <div class="offline-status">
      <span class="status-dot offline"></span>
      <span id="statusText" style="font-family:'IRANYekanXFaNum','Segoe UI',Tahoma,sans-serif !important;">آفلاین</span>
    </div>
  </div>

  <script>
    let retryCount = 0;
    const maxRetries = 10;
    const statusText = document.getElementById('statusText');
    const statusDot = document.querySelector('.status-dot');

    function updateStatus(message, type) {
      if (statusText) {
        statusText.textContent = message;
      }
      if (statusDot) {
        statusDot.className = 'status-dot ' + type;
      }
    }

    function checkConnection() {
      if (navigator.onLine) {
        updateStatus('✅ آنلاین - در حال بارگذاری...', 'online');
        window.location.reload();
        return;
      }

      if (retryCount < maxRetries) {
        retryCount++;
        updateStatus(`⏳ تلاش ${retryCount} از ${maxRetries}...`, 'checking');
        setTimeout(checkConnection, 5000);
      } else {
        updateStatus('❌ اتصال برقرار نشد. دستی تلاش کنید.', 'offline');
      }
    }

    setTimeout(checkConnection, 3000);

    window.addEventListener('online', () => {
      updateStatus('✅ آنلاین - در حال بارگذاری...', 'online');
      setTimeout(() => {
        window.location.reload();
      }, 500);
    });

    window.addEventListener('offline', () => {
      updateStatus('📡 آفلاین', 'offline');
    });

    console.log('📡 Offline page loaded. Connection status:', navigator.onLine ? 'Online' : 'Offline');
  </script>
</body>
</html>
