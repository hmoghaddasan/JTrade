    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/service-worker.js')
            .then((registration) => {
              console.log('✅ Service Worker registered successfully:', registration);

              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('🔄 New version available!');
                      const event = new CustomEvent('newVersionAvailable', {
                        detail: { message: 'نسخه جدیدی موجود است. برای به‌روزرسانی صفحه را رفرش کنید.' }
                      });
                      window.dispatchEvent(event);
                    }
                  });
                }
              });
            })
            .catch((error) => {
              console.error('❌ Service Worker registration failed:', error);
            });
        });
      }
    </script>

    <script>
      window.addEventListener('offline', () => {
        const event = new CustomEvent('connectionChange', {
          detail: { status: 'offline', message: '⚠️ اتصال اینترنت قطع شد. برخی از امکانات ممکن است در دسترس نباشند.' }
        });
        window.dispatchEvent(event);
      });

      window.addEventListener('online', () => {
        const event = new CustomEvent('connectionChange', {
          detail: { status: 'online', message: '✅ اتصال اینترنت برقرار شد.' }
        });
        window.dispatchEvent(event);
      });
    </script>
